<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レシート家計簿</title>
<meta name="description" content="レシートを撮ると品目ごとにジャンル分けして、月にいくら何に使ったかがわかる家計簿">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one ledger column — month total on top, category ledger, daily strip, then the dated entries; a fixed action bar for camera / photo / manual entry. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --sunk:#e3e8e6; --ink:#16201f; --muted:#5d6a68; --rule:#cfd7d4;
  --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#dfe8f4;
  --warn:#b4541a; --ok:#2c7a4b; --danger:#b3261e; --receipt:#fbfbf7;
  --shadow:0 1px 2px rgba(22,32,31,.06),0 8px 24px rgba(22,32,31,.08);
  --c-food:#3f8f4f; --c-dining:#d0732d; --c-daily:#4f7fb8; --c-clothes:#b4508a;
  --c-sports:#1d9a9a; --c-transport:#6b6fc7; --c-hobby:#c49a1c; --c-medical:#d24b4b;
  --c-home:#7a6a58; --c-social:#e0779b; --c-education:#5b8f2f; --c-misc:#8a9493;
  --f-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --surface:#1a2221; --sunk:#232d2b; --ink:#e7eeec; --muted:#9aa8a5; --rule:#2f3a38;
  --accent:#8fb3ec; --accent-ink:#0d1a2e; --accent-soft:#1f2c40; --warn:#e89a5f; --ok:#6fcf97; --danger:#ff8a80;
  --receipt:#202826; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --c-food:#69c17a; --c-dining:#f0985a; --c-daily:#7fa9df; --c-clothes:#e07fb7; --c-sports:#4cc7c7; --c-transport:#9ea2f0;
  --c-hobby:#e8c24d; --c-medical:#f27b7b; --c-home:#b9a68f; --c-social:#f5a3be; --c-education:#94c86a; --c-misc:#a9b4b2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#1a2221; --sunk:#232d2b; --ink:#e7eeec; --muted:#9aa8a5; --rule:#2f3a38;
  --accent:#8fb3ec; --accent-ink:#0d1a2e; --accent-soft:#1f2c40; --warn:#e89a5f; --ok:#6fcf97; --danger:#ff8a80;
  --receipt:#202826; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --c-food:#69c17a; --c-dining:#f0985a; --c-daily:#7fa9df; --c-clothes:#e07fb7; --c-sports:#4cc7c7; --c-transport:#9ea2f0;
  --c-hobby:#e8c24d; --c-medical:#f27b7b; --c-home:#b9a68f; --c-social:#f5a3be; --c-education:#94c86a; --c-misc:#a9b4b2;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 150px;display:grid;gap:22px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.brand h1{font-size:18px;font-weight:900;letter-spacing:.04em}
.store-note{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;padding:0;text-decoration:underline;text-underline-offset:3px}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:3px}
.month-nav button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;font-size:17px}
.month-nav button:hover{background:var(--sunk)}
.month-nav .label{font-weight:700;min-width:118px;text-align:center}

.hero{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px 18px;display:grid;gap:14px}
.total-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.total{font-family:var(--f-num);font-weight:500;font-size:clamp(38px,9vw,56px);line-height:1;letter-spacing:-.03em}
.total small{font-family:var(--f-jp);font-size:.42em;font-weight:700;margin-left:4px;letter-spacing:0}
.delta{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.delta.up{color:var(--warn)} .delta.down{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px dashed var(--rule);padding-top:12px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.budget{display:grid;gap:6px}
.budget-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.budget-head button{border:0;background:none;color:var(--accent);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s ease}
.bar i.over{background:var(--danger)}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.budget-edit{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

.section{display:grid;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:16px;font-weight:900;letter-spacing:.03em}
.section-head .aside{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;border:1px solid var(--rule)}

.cats{padding:6px 14px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}
.cat-row:last-child{border-bottom:0}
.cat-name{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0;flex-wrap:wrap}
.cat-name .pct{font-weight:400;color:var(--muted);font-size:12.5px}
.cat-name .vs{font-weight:400;font-size:11.5px;color:var(--muted)}
.cat-name .vs.up{color:var(--warn)} .cat-name .vs.down{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat-amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.cat-bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.cat-bar i{display:block;height:100%;border-radius:999px}
.stack{display:flex;height:14px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 4px}
.stack i{display:block;height:100%}

.daily{padding:14px 12px 8px;overflow-x:auto}
.daily svg{display:block;width:100%;min-width:480px;height:auto}
.daily text{fill:var(--muted);font-family:var(--f-num);font-size:10px}

.day-group{display:grid;gap:6px}
.day-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:0 4px;font-weight:700}
.entries{overflow:hidden}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;width:100%}
.entry:last-child{border-bottom:0}
.entry:hover{background:var(--sunk)}
.entry .title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.entry .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;text-align:right}
.entry .chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:2px}
.src{font-size:10.5px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.empty{padding:18px;color:var(--muted);font-size:13.5px}

.actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;z-index:20}
.actions-inner{display:flex;gap:8px;width:100%;max-width:560px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:13.5px}
.actions .btn{flex:1;box-shadow:var(--shadow);font-size:14px;padding-inline:8px}
.actions .btn.primary{flex:1.5}
.ico{width:20px;height:20px;flex:none}

.overlay{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{font-size:17px;font-weight:900}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:999px;font-size:18px;line-height:1;flex:none}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:700;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input.num{font-family:var(--f-num)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px}
.item select{grid-column:1/3;font-size:14px;padding:7px 9px}
.item .rm{grid-row:1/3;grid-column:3;border:0;background:transparent;color:var(--muted);font-size:20px;height:100%}
.item input{padding:7px 9px}
.sum-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.sum-line .num{font-size:22px}
.mismatch{font-size:13px;color:var(--warn);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-foot{display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1}

.scan{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;background:var(--receipt);border:1px dashed var(--rule);border-radius:14px;padding:12px}
.scan img{width:96px;height:128px;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.scan .status{font-size:14px;display:grid;gap:6px;min-width:0}
.scan .status b{font-size:15px}
.scanline{position:relative;width:96px;height:128px;border-radius:6px;overflow:hidden}
.scanline::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 12px var(--accent);top:0;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.scanline::after{animation:none;top:50%}.bar i{transition:none}}
details.raw{font-size:12.5px;color:var(--muted)}
details.raw pre{white-space:pre-wrap;font-family:var(--f-num);font-size:11.5px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px;max-height:220px;overflow:auto;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13.5px;color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.foot-tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;display:grid;gap:16px}
.auth-card h1{font-size:22px;font-weight:900;letter-spacing:.04em}
.auth-card p{margin:0;color:var(--muted);font-size:13.5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.ok-msg{font-size:13.5px;color:var(--ok)}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (max-width:420px){.stat .v{font-size:15px}.item{grid-template-columns:minmax(0,1fr) 92px 30px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="loading" id="bootView">読み込み中…</div>

<!-- ===== login ===== -->
<div class="auth" id="authView" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <div class="brand"><div class="mark" aria-hidden="true">¥</div><h1>レシート家計簿</h1></div>
    <p>レシートを撮るだけで、品目ごとにジャンル分けして毎月の支出をまとめます。スマホでもPCでも、同じアカウントでログインすれば同じ記録が見られます。</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">ログイン</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">新規登録</button>
    </div>
    <label class="f">メールアドレス<input type="email" id="authEmail" autocomplete="email" required></label>
    <label class="f">パスワード（6文字以上）<input type="password" id="authPass" autocomplete="current-password" minlength="6" required></label>
    <div class="note" id="inAppNote" hidden>アプリ内のブラウザで開いています。ここではログインが保存されないことがあるので、右上のメニューから「Safariで開く」（Androidは「Chromeで開く」）を選んでください。</div>
    <div class="err" id="authErr" hidden></div>
    <div class="ok-msg" id="authOk" hidden></div>
    <button class="btn primary" type="submit" id="authSubmit">ログイン</button>
    <button class="linkbtn" type="button" id="forgotBtn" style="justify-self:start">パスワードを忘れた</button>
  </form>
</div>

<!-- ===== app ===== -->
<div id="appView" hidden>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">¥</div>
      <div style="min-width:0">
        <h1>レシート家計簿</h1>
        <div class="store-note"><span id="syncNote">同期中…</span><button class="linkbtn" id="logoutBtn">ログアウト</button></div>
      </div>
    </div>
    <nav class="month-nav" aria-label="月の切り替え">
      <button id="prevM" aria-label="前の月">‹</button>
      <span class="label" id="monthLabel"></span>
      <button id="nextM" aria-label="次の月">›</button>
    </nav>
  </header>

  <section class="hero" aria-label="今月の支出">
    <div class="total-row">
      <div>
        <div class="eyebrow" id="heroLabel">今月の支出</div>
        <div class="total" id="total">0<small>円</small></div>
      </div>
      <span class="delta" id="delta">先月比 —</span>
    </div>
    <div class="budget" id="budgetBox"></div>
    <div class="stats">
      <div class="stat"><div class="k">記録件数</div><div class="v" id="sCount">0件</div></div>
      <div class="stat"><div class="k">1日平均</div><div class="v" id="sAvg">¥0</div></div>
      <div class="stat"><div class="k">最大の出費</div><div class="v" id="sMax">—</div></div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>ジャンル別</h2><span class="aside" id="catAside"></span></div>
    <div class="card cats" id="cats"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>日ごとの支出</h2><span class="aside">棒＝その日の合計</span></div>
    <div class="card daily" id="daily"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>明細</h2><span class="aside">タップで編集</span></div>
    <div id="list" style="display:grid;gap:14px"></div>
  </section>

  <div class="foot-tools">
    <button class="btn small ghost" id="csvBtn" hidden>この月をCSVで保存</button>
  </div>
</div>

<div class="actions">
  <div class="actions-inner">
    <button class="btn primary" id="camBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      カメラで撮る
    </button>
    <button class="btn" id="pickBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      写真から
    </button>
    <button class="btn" id="manualBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      手入力
    </button>
  </div>
</div>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="pickInput" accept="image/*" hidden>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";

/* ---------- config (publishable key: safe to ship; rows are protected by row-level security) ---------- */
const SUPABASE_URL = "https://gyqbxaqgayywrvhrqswu.supabase.co";
const SUPABASE_KEY = "sb_publishable_gvhKGwHDpmUH2msFutnuEw_KWGoEY2D";

/* ---------- login persistence ----------
   The session lives in localStorage with a copy in IndexedDB, so a browser that drops one
   (storage pressure, an in-app browser reset) can restore it from the other. */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open("kakeibo-auth", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
  return {
    get: k => tx("readonly", s => s.get(k)).catch(() => null),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => {}),
    del: k => tx("readwrite", s => s.delete(k)).catch(() => {}),
  };
})();
const authStorage = {
  async getItem(k){
    let v = null;
    try { v = localStorage.getItem(k); } catch {}
    if (v == null) { v = (await IDB.get(k)) ?? null; if (v != null) try { localStorage.setItem(k, v); } catch {} }
    return v;
  },
  async setItem(k, v){ try { localStorage.setItem(k, v); } catch {} await IDB.set(k, v); },
  async removeItem(k){ try { localStorage.removeItem(k); } catch {} await IDB.del(k); },
};

let authMode = "login";
function setAuthMode(m){
  authMode = m;
  $("tabLogin").setAttribute("aria-selected", m === "login");
  $("tabSignup").setAttribute("aria-selected", m === "signup");
  $("authSubmit").textContent = m === "login" ? "ログイン" : "登録する";
  $("authPass").autocomplete = m === "login" ? "current-password" : "new-password";
  $("authErr").hidden = true; $("authOk").hidden = true;
}
$("tabLogin").onclick = () => setAuthMode("login");
$("tabSignup").onclick = () => setAuthMode("signup");

const authErrCopy = e => {
  const m = (e?.message || "").toLowerCase();
  if (m.includes("invalid login")) return "メールアドレスかパスワードが違います。";
  if (m.includes("email not confirmed")) return "まだメールの確認が済んでいません。届いたメールのリンクを押してから、もう一度ログインしてください。";
  if (m.includes("already registered")) return "このメールアドレスは登録済みです。「ログイン」から入ってください。";
  if (m.includes("password")) return "パスワードは6文字以上にしてください。";
  if (m.includes("rate limit")) return "短時間に何度も送信されました。少し時間をおいてお試しください。";
  return "うまくいきませんでした。通信状態を確認して、もう一度お試しください。";
};

$("authForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const email = $("authEmail").value.trim(), password = $("authPass").value;
  $("authErr").hidden = true; $("authOk").hidden = true;
  if (!/^\S+@\S+\.\S+$/.test(email)) { $("authErr").textContent = "メールアドレスを正しく入れてください。"; $("authErr").hidden = false; return; }
  if (password.length < 6) { $("authErr").textContent = "パスワードは6文字以上にしてください。"; $("authErr").hidden = false; return; }
  try { localStorage.setItem("kakeibo-email", email); } catch {}
  const btn = $("authSubmit"); btn.disabled = true;
  try {
    if (authMode === "login") {
      const {error} = await sb.auth.signInWithPassword({email, password});
      if (error) throw error;
    } else {
      const {data, error} = await sb.auth.signUp({email, password, options: {emailRedirectTo: location.origin + location.pathname}});
      if (error) throw error;
      if (!data.session) {
        setAuthMode("login");
        $("authOk").textContent = `${email} に確認メールを送りました。メールのリンクを押すと登録が完了します。完了したら、ここでログインしてください。`;
        $("authOk").hidden = false;
      }
    }
  } catch (e) { $("authErr").textContent = authErrCopy(e); $("authErr").hidden = false; }
  finally { btn.disabled = false; }
});

$("forgotBtn").onclick = async () => {
  const email = $("authEmail").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $("authErr").textContent = "先にメールアドレスを入れてから押してください。"; $("authErr").hidden = false; return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  if (error) { $("authErr").textContent = authErrCopy(error); $("authErr").hidden = false; return; }
  $("authOk").textContent = "パスワード再設定のメールを送りました。メールのリンクから戻ってくると、新しいパスワードを設定できます。"; $("authOk").hidden = false;
};

$("logoutBtn").onclick = async () => { await sb.auth.signOut(); };

function showView(v){ $("bootView").hidden = v !== "boot"; $("authView").hidden = v !== "auth"; $("appView").hidden = v !== "app"; }

let channel = null;
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") { setTimeout(openPasswordReset, 0); }
  const user = session?.user || null;
  if (user && state.user?.id === user.id) return;
  state.user = user;
  if (!user) {
    state.expenses = []; state.budget = 0; state.loaded = false;
    if (channel) { sb.removeChannel(channel); channel = null; }
    closeSheet(); showView("auth"); return;
  }
  showView("app"); render();
  setTimeout(() => { loadAll(); subscribe(); }, 0);
});

/* ================= data ================= */
const rowToExpense = r => ({id: r.id, date: r.date, store: r.store, memo: r.memo, items: Array.isArray(r.items) ? r.items : [], total: r.total, source: r.source, createdAt: Date.parse(r.created_at) || 0});

async function loadAll(){
  $("syncNote").textContent = "同期中…";
  try {
    const all = []; const PAGE = 1000;
    for (let from = 0; ; from += PAGE) {
      const {data, error} = await sb.from("expenses").select("*").order("date", {ascending: false}).range(from, from + PAGE - 1);
      if (error) throw error;
      all.push(...data); if (data.length < PAGE) break;
    }
    const {data: st, error: e2} = await sb.from("settings").select("budget").maybeSingle();
    if (e2) throw e2;
    state.expenses = all.map(rowToExpense); state.budget = st?.budget || 0; state.loaded = true;
    $("syncNote").textContent = state.user?.email ? `${state.user.email} で同期中` : "同期済み";
  } catch (e) {
    $("syncNote").textContent = "記録を読み込めませんでした。電波の良い場所で開き直してください。";
  }
  render();
}

function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("kakeibo-" + state.user.id)
    .on("postgres_changes", {event: "*", schema: "public", table: "expenses", filter: `user_id=eq.${state.user.id}`}, p => {
      if (p.eventType === "DELETE") state.expenses = state.expenses.filter(x => x.id !== p.old?.id);
      else { const e = rowToExpense(p.new); const i = state.expenses.findIndex(x => x.id === e.id); if (i >= 0) state.expenses[i] = e; else state.expenses.push(e); }
      render();
    })
    .on("postgres_changes", {event: "*", schema: "public", table: "settings", filter: `user_id=eq.${state.user.id}`}, p => {
      if (p.new && "budget" in p.new) { state.budget = p.new.budget || 0; render(); }
    })
    .subscribe();
}
// Catch anything missed while the phone was asleep.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.user) loadAll(); });

async function persistExpense(e){
  const row = {id: e.id, user_id: state.user.id, date: e.date, store: e.store, memo: e.memo, items: e.items, total: e.total, source: e.source, updated_at: new Date().toISOString()};
  const {error} = await sb.from("expenses").upsert(row);
  if (error) throw error;
  const i = state.expenses.findIndex(x => x.id === e.id);
  if (i >= 0) state.expenses[i] = {...state.expenses[i], ...e}; else state.expenses.push({...e, createdAt: Date.now()});
  render();
}
async function removeExpense(id){
  const {error} = await sb.from("expenses").delete().eq("id", id);
  if (error) throw error;
  state.expenses = state.expenses.filter(x => x.id !== id); render();
}
async function persistBudget(v){
  const {error} = await sb.from("settings").upsert({user_id: state.user.id, budget: v, updated_at: new Date().toISOString()});
  if (error) throw error;
  state.budget = v; render();
}

/* ================= render ================= */
const monthExpenses = ym => state.expenses.filter(e => monthOf(e.date) === ym);
function catTotals(list){
  const t = {}; for (const e of list) for (const it of e.items || []) { const c = CAT[it.category] ? it.category : "misc"; t[c] = (t[c] || 0) + toInt(it.amount); }
  return t;
}
const entryTotal = e => (e.items && e.items.length) ? sumItems(e.items) : toInt(e.total);

function render(){
  const ym = state.month;
  const [y, m] = ym.split("-").map(Number);
  $("monthLabel").textContent = `${y}年${m}月`;
  const isCurrent = ym === monthOf(todayStr());
  $("heroLabel").textContent = isCurrent ? "今月の支出" : `${m}月の支出`;

  const list = monthExpenses(ym), prev = monthExpenses(shiftMonth(ym, -1));
  const total = list.reduce((a, e) => a + entryTotal(e), 0);
  const prevTotal = prev.reduce((a, e) => a + entryTotal(e), 0);

  $("total").innerHTML = `${Math.round(total).toLocaleString("ja-JP")}<small>円</small>`;
  const delta = $("delta"); delta.className = "delta";
  if (prevTotal > 0) { const diff = total - prevTotal; delta.textContent = `先月比 ${diff >= 0 ? "+" : "−"}${Math.abs(diff).toLocaleString("ja-JP")}円`; delta.classList.add(diff > 0 ? "up" : "down"); }
  else delta.textContent = "先月比 —";

  const days = daysIn(ym), elapsed = isCurrent ? new Date().getDate() : days;
  $("sCount").textContent = list.length + "件";
  $("sAvg").textContent = yen(elapsed ? total / elapsed : 0);
  const biggest = list.reduce((b, e) => !b || entryTotal(e) > entryTotal(b) ? e : b, null);
  $("sMax").textContent = biggest ? yen(entryTotal(biggest)) : "—";
  $("sMax").title = biggest ? biggest.store : "";

  renderBudget(total, isCurrent, elapsed, days);
  renderCats(catTotals(list), catTotals(prev), total, prevTotal > 0);
  renderDaily(list, ym, days);
  renderList(list);
  $("csvBtn").hidden = list.length === 0;
}

let editingBudget = false;
function renderBudget(total, isCurrent, elapsed, days){
  const box = $("budgetBox");
  if (editingBudget) {
    box.innerHTML = `<div class="budget-edit"><label class="f" style="flex:1">月の予算（円）<input id="budgetInput" class="num" inputmode="numeric" value="${state.budget || ""}" placeholder="例: 150000"></label>
      <button class="btn small primary" id="budgetSave">保存</button><button class="btn small" id="budgetCancel">やめる</button></div>`;
    $("budgetInput").focus();
    $("budgetSave").onclick = async () => {
      try { await persistBudget(toInt($("budgetInput").value)); editingBudget = false; render(); toast("予算を保存しました"); }
      catch { toast("保存できませんでした。通信状態を確認してください"); }
    };
    $("budgetCancel").onclick = () => { editingBudget = false; render(); };
    return;
  }
  if (!state.budget) {
    box.innerHTML = `<div class="budget-head"><span>予算を決めると、ペースと残りが見えます</span><button id="budgetEdit">予算を設定</button></div>`;
  } else {
    const pct = Math.min(100, total / state.budget * 100), left = state.budget - total;
    const pacePct = isCurrent ? elapsed / days * 100 : 100;
    box.innerHTML = `<div class="budget-head"><span>予算 <span class="num">${yen(state.budget)}</span> ・ ${left >= 0 ? `残り <b class="num">${yen(left)}</b>` : `<b style="color:var(--danger)">超過 <span class="num">${yen(-left)}</span></b>`}</span><button id="budgetEdit">変更</button></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="予算の消化率"><i class="${left < 0 ? "over" : ""}" style="width:${pct}%"></i>${isCurrent ? `<span class="pace" style="left:${pacePct}%" title="今日までの目安"></span>` : ""}</div>
      ${isCurrent ? `<div class="hint">縦線は今日までの目安（${Math.round(pacePct)}%）。消化率 ${Math.round(total / state.budget * 100)}%</div>` : ""}`;
  }
  $("budgetEdit").onclick = () => { editingBudget = true; render(); };
}

function renderCats(t, prevT, total, hasPrev){
  const rows = Object.entries(t).filter(([, v]) => v !== 0).sort((a, b) => b[1] - a[1]);
  $("catAside").textContent = rows.length ? `${rows.length}ジャンル` : "";
  if (!rows.length) { $("cats").innerHTML = `<div class="empty">この月の記録はまだありません。レシートを撮ると、品目ごとに自動でジャンル分けされます。</div>`; return; }
  const max = Math.max(...rows.map(r => r[1]), 1);
  $("cats").innerHTML =
    `<div class="stack" aria-hidden="true">${rows.filter(r => r[1] > 0).map(([c, v]) => `<i style="flex:${v};background:${catColor(c)}"></i>`).join("")}</div>` +
    rows.map(([c, v]) => {
      const d = v - (prevT[c] || 0);
      const vs = hasPrev && d !== 0 ? `<span class="vs ${d > 0 ? "up" : "down"}">先月${d > 0 ? "+" : "−"}${Math.abs(d).toLocaleString("ja-JP")}</span>` : "";
      return `<div class="cat-row">
      <div class="cat-name"><span class="dot" style="background:${catColor(c)}"></span>${esc(CAT[c].label)} <span class="pct num">${total ? Math.round(v / total * 100) : 0}%</span>${vs}</div>
      <div class="cat-amt">${yen(v)}</div>
      <div class="cat-bar"><i style="width:${Math.max(0, v) / max * 100}%;background:${catColor(c)}"></i></div></div>`;
    }).join("");
}

function renderDaily(list, ym, days){
  const per = Array(days).fill(0);
  for (const e of list) { const d = Number(e.date.slice(8, 10)); if (d >= 1 && d <= days) per[d - 1] += entryTotal(e); }
  const max = Math.max(...per, 1);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= max) return k * p; return 10 * p; })();
  const W = 640, H = 170, L = 44, R = 8, T = 10, B = 22, bw = (W - L - R) / days, ih = H - T - B;
  const today = todayStr(), isCur = ym === monthOf(today), td = Number(today.slice(8));
  let g = "";
  for (const f of [0, .5, 1]) {
    const yy = T + ih - ih * f;
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--rule)" stroke-width="1" ${f ? 'stroke-dasharray="3 4"' : ""}/>`;
    g += `<text x="${L - 6}" y="${yy + 3}" text-anchor="end">${f ? (nice * f >= 10000 ? (nice * f / 10000) + "万" : Math.round(nice * f).toLocaleString()) : "0"}</text>`;
  }
  per.forEach((v, i) => {
    const h = Math.max(0, v) / nice * ih, x = L + i * bw + bw * .18, w = bw * .64, isToday = isCur && i + 1 === td;
    if (v > 0) g += `<rect x="${x.toFixed(1)}" y="${(T + ih - h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 1.5).toFixed(1)}" rx="2" fill="${isToday ? "var(--accent)" : "var(--c-daily)"}" opacity="${isToday ? 1 : .8}"><title>${i + 1}日 ${yen(v)}</title></rect>`;
    if (i === 0 || (i + 1) % 5 === 0) g += `<text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`;
  });
  $("daily").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの支出の棒グラフ">${g}</svg>`;
}

function renderList(list){
  const el = $("list");
  if (!list.length) { el.innerHTML = `<div class="card empty">${state.loaded ? "まだ明細がありません。下の「カメラで撮る」「写真から」「手入力」で最初の1件を登録しましょう。" : "読み込み中…"}</div>`; return; }
  const byDay = {}; for (const e of list) (byDay[e.date] ||= []).push(e);
  el.innerHTML = Object.keys(byDay).sort().reverse().map(d => {
    const es = byDay[d].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const dayTotal = es.reduce((a, e) => a + entryTotal(e), 0);
    return `<div class="day-group"><div class="day-label"><span>${Number(d.slice(5, 7))}/${Number(d.slice(8))}（${wd(d)}）</span><span class="num">${yen(dayTotal)}</span></div>
      <div class="card entries">${es.map(e => {
        const ct = catTotals([e]), multi = Object.keys(ct).length > 1;
        const chips = Object.entries(ct).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<span class="chip"><span class="dot" style="background:${catColor(c)}"></span>${esc(CAT[c].label)}${multi ? ` <span class="num">${yen(v)}</span>` : ""}</span>`).join("");
        return `<button class="entry" data-id="${esc(e.id)}"><span class="title">${esc(e.store || e.items?.[0]?.name || "支出")}</span><span class="amt">${yen(entryTotal(e))}</span>
          <span class="chips">${chips}${e.source === "receipt" ? `<span class="src">レシート</span>` : ""}${e.items?.length > 1 ? `<span class="src">${e.items.length}品目</span>` : ""}</span></button>`;
      }).join("")}</div></div>`;
  }).join("");
  el.querySelectorAll(".entry").forEach(b => b.onclick = () => { const e = state.expenses.find(x => x.id === b.dataset.id); if (e) openEditor(JSON.parse(JSON.stringify(e))); });
}

/* ================= editor sheet ================= */
let draft = null, scanToken = 0;
function closeSheet(){ $("overlay").hidden = true; draft = null; scanToken++; }
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });
const catOptions = sel => CATS.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.label)}</option>`).join("");

function openEditor(d, opts = {}){
  draft = d; draft.items ||= [];
  const isNew = !state.expenses.some(x => x.id === d.id);
  const s = $("sheet");
  s.innerHTML = `
    <div class="sheet-head"><h3 id="sheetTitle">${opts.scanning ? "レシートを読み取り中" : isNew ? (d.source === "receipt" ? "読み取り結果を確認" : "支出を記録") : "支出を編集"}</h3><button class="x" id="sheetX" aria-label="閉じる">×</button></div>
    ${opts.imageUrl ? `<div class="scan"><div class="${opts.scanning ? "scanline" : ""}"><img src="${opts.imageUrl}" alt="撮影したレシート"></div><div class="status" id="scanStatus">${opts.scanning
      ? `<b>AIがレシートを読み取っています</b><span class="hint">品目・金額・ジャンルを分析中です。5〜20秒ほどかかります。</span>`
      : `<b>読み取りました</b><span class="hint">品目・金額・ジャンルを確認して、違っていれば直してください。</span>`}</div></div>` : ""}
    <div id="formArea" ${opts.scanning ? "hidden" : ""}>
      <div style="display:grid;gap:12px">
        <div class="grid2">
          <label class="f">日付<input type="date" id="fDate" value="${esc(d.date || todayStr())}"></label>
          <label class="f">お店・内容<input id="fStore" value="${esc(d.store || "")}" placeholder="例: ライフ 清澄白河店"></label>
        </div>
        <div class="section-head"><span class="eyebrow">品目</span><button class="btn small ghost" id="addItem">＋ 品目を追加</button></div>
        <div class="items" id="items"></div>
        <div class="sum-line"><span>合計</span><span class="num" id="fSum">¥0</span></div>
        <div class="mismatch" id="mismatch" hidden></div>
        <label class="f">メモ（任意）<input id="fMemo" value="${esc(d.memo || "")}"></label>
        <div class="err" id="fErr" hidden></div>
        <div class="sheet-foot">
          ${!isNew ? `<button class="btn danger" id="delBtn">削除</button>` : ""}
          <button class="btn primary" id="saveBtn">${isNew ? "記録する" : "保存"}</button>
        </div>
      </div>
    </div>`;
  $("overlay").hidden = false;
  $("sheetX").onclick = closeSheet;
  if (opts.scanning) return;

  if (!draft.items.length) draft.items.push({name: "", amount: "", category: "misc"});
  drawItems();
  $("fStore").addEventListener("input", () => { draft.store = $("fStore").value; });
  $("addItem").onclick = () => { syncDraft(); draft.items.push({name: "", amount: "", category: draft.items.at(-1)?.category || "misc"}); drawItems(); $("items").lastElementChild?.querySelector("input")?.focus(); };
  $("saveBtn").onclick = save;
  if ($("delBtn")) $("delBtn").onclick = async ev => {
    const b = ev.currentTarget;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "もう一度押すと削除"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "削除"; }, 3000); return; }
    try { await removeExpense(draft.id); closeSheet(); toast("削除しました"); } catch { showErr("削除できませんでした。通信状態を確認してもう一度お試しください。"); }
  };
  if (isNew && d.source !== "receipt") setTimeout(() => $("items").querySelector("input")?.focus(), 60);
}

function drawItems(){
  const box = $("items");
  box.innerHTML = draft.items.map((it, i) => `
    <div class="item" data-i="${i}">
      <input aria-label="品名" class="iname" value="${esc(it.name)}" placeholder="品名（例: 弁当）">
      <input aria-label="金額" class="iamt num" inputmode="numeric" value="${it.amount === "" ? "" : toInt(it.amount)}" placeholder="円">
      <select aria-label="ジャンル" class="icat">${catOptions(it.category)}</select>
      <button class="rm" aria-label="この品目を削除" ${draft.items.length < 2 ? "disabled" : ""}>×</button>
    </div>`).join("");
  box.querySelectorAll(".item").forEach(row => {
    const i = Number(row.dataset.i), nm = row.querySelector(".iname"), cat = row.querySelector(".icat");
    nm.addEventListener("input", () => {
      draft.items[i].name = nm.value;
      if (!draft.items[i].catTouched) { const g = guessCat(nm.value, $("fStore")?.value); if (g !== "misc") { draft.items[i].category = g; cat.value = g; } }
    });
    row.querySelector(".iamt").addEventListener("input", e => { draft.items[i].amount = e.target.value; updateSum(); });
    cat.addEventListener("change", () => { draft.items[i].category = cat.value; draft.items[i].catTouched = true; });
    row.querySelector(".rm").onclick = () => { syncDraft(); draft.items.splice(i, 1); drawItems(); };
  });
  updateSum();
}
function syncDraft(){ if (!$("fDate")) return; draft.date = $("fDate").value; draft.store = $("fStore").value.trim(); draft.memo = $("fMemo").value.trim(); }

function updateSum(){
  const s = sumItems(draft.items);
  $("fSum").textContent = yen(s);
  const mm = $("mismatch");
  if (draft.printedTotal && toInt(draft.printedTotal) !== s) {
    const diff = toInt(draft.printedTotal) - s;
    mm.hidden = false;
    mm.innerHTML = `<span>レシートの合計 ${yen(draft.printedTotal)} と ${yen(Math.abs(diff))} ずれています。</span><button class="btn small" id="fixDiff">差額を「税・調整」として追加</button>`;
    $("fixDiff").onclick = () => { syncDraft(); const top = Object.entries(catTotals([draft])).sort((a, b) => b[1] - a[1])[0]?.[0] || "misc"; draft.items.push({name: "税・調整", amount: diff, category: top, catTouched: true}); drawItems(); };
  } else mm.hidden = true;
}
function showErr(msg){ const e = $("fErr"); if (e) { e.textContent = msg; e.hidden = false; } }

async function save(){
  syncDraft();
  const items = draft.items.map(it => ({name: (it.name || "").trim(), amount: toInt(it.amount), category: CAT[it.category] ? it.category : "misc"})).filter(it => it.amount !== 0 || it.name);
  if (!items.length || items.every(it => it.amount === 0)) return showErr("金額を1つ以上入力してください。");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(draft.date || "")) return showErr("日付を入れてください。");
  for (const it of items) if (!it.name) it.name = CAT[it.category].label;
  const e = {id: draft.id, date: draft.date, store: draft.store || items[0].name, memo: draft.memo || "", items, total: sumItems(items), source: draft.source || "manual"};
  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "保存中…";
  try {
    await persistExpense(e);
    closeSheet();
    if (monthOf(e.date) !== state.month) { state.month = monthOf(e.date); render(); }
    toast(`${yen(e.total)} を記録しました`);
  } catch {
    btn.disabled = false; btn.textContent = "記録する";
    showErr("保存できませんでした。通信状態を確認してもう一度お試しください。");
  }
}
const newDraft = source => ({id: newId(), date: todayStr(), store: "", items: [], source});

function openPasswordReset(){
  $("sheet").innerHTML = `<div class="sheet-head"><h3 id="sheetTitle">新しいパスワード</h3><button class="x" id="sheetX" aria-label="閉じる">×</button></div>
    <label class="f">新しいパスワード（6文字以上）<input type="password" id="newPass" autocomplete="new-password"></label>
    <div class="err" id="fErr" hidden></div><button class="btn primary" id="newPassBtn">変更する</button>`;
  $("overlay").hidden = false; $("sheetX").onclick = closeSheet;
  $("newPassBtn").onclick = async () => {
    const p = $("newPass").value; if (p.length < 6) return showErr("6文字以上にしてください。");
    const {error} = await sb.auth.updateUser({password: p});
    if (error) return showErr(authErrCopy(error));
    closeSheet(); toast("パスワードを変更しました");
  };
}

/* ================= receipt reading (Gemini via the scan-receipt edge function) ================= */
// Downscale to ~1600px JPEG so the upload is small but digits stay sharp.
async function prepImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", .88);
    return {base64: dataUrl.split(",")[1], preview: c.toDataURL("image/jpeg", .5)};
  } finally { URL.revokeObjectURL(url); }
}

const SCAN_ERR = {
  no_key: "AI読み取りの設定（GeminiのAPIキー）がまだ終わっていません。設定が済むまでは手入力で記録してください。",
  bad_key: "AI読み取りのAPIキーが正しくないようです。設定したキーを確認してください。",
  quota: "AI読み取りの無料枠を一時的に使い切りました。1分ほど待つか、明日もう一度お試しください。",
  forbidden: "このアカウントではAI読み取りを使えない設定になっています。",
  unauthorized: "ログインの有効期限が切れました。ログインし直してください。",
  bad_image: "画像が大きすぎるか壊れています。撮り直してください。",
  bad_request: "画像を読み取れませんでした。レシート全体が写るように撮り直してください。",
  network: "通信できませんでした。電波の良い場所でもう一度お試しください。",
};

async function scanReceipt(base64){
  const {data, error} = await sb.functions.invoke("scan-receipt", {body: {image: base64, mime: "image/jpeg", today: todayStr()}});
  if (error) {
    let code = "network";
    try { const j = await error.context?.json?.(); code = j?.error || code; } catch {}
    throw {code};
  }
  return data.result;
}

async function handlePhoto(file){
  if (!file) return;
  const token = ++scanToken;
  let prep;
  try { prep = await prepImage(file); }
  catch { toast("この画像は開けませんでした。JPEGかPNGの写真でお試しください"); return; }
  const d = newDraft("receipt");
  openEditor(d, {scanning: true, imageUrl: prep.preview});
  const retryButtons = `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="retake">撮り直す</button><button class="btn small" id="toManual">手入力にする</button></div>`;
  const wireRetry = () => {
    $("retake").onclick = () => { closeSheet(); $("camInput").click(); };
    $("toManual").onclick = () => openEditor(newDraft("manual"));
  };
  try {
    const r = await scanReceipt(prep.base64);
    if (token !== scanToken) return;
    if (!r || r.is_receipt === false || !Array.isArray(r.items) || !r.items.length) {
      $("scanStatus").innerHTML = `<b>レシートが見つかりませんでした</b><span class="hint">レシート全体が明るく写るように撮り直してください。</span>${retryButtons}`;
      wireRetry(); return;
    }
    d.store = String(r.store || "").slice(0, 60);
    if (/^\d{4}-\d{2}-\d{2}$/.test(r.date || "")) d.date = r.date;
    d.items = r.items.map(it => ({name: String(it.name || "").slice(0, 60), amount: toInt(it.amount), category: CAT[it.category] ? it.category : guessCat(it.name, r.store)}));
    d.printedTotal = toInt(r.total) || null;
    openEditor(d, {imageUrl: prep.preview});
  } catch (e) {
    if (token !== scanToken) return;
    $("scanStatus").innerHTML = `<b>読み取りに失敗しました</b><span class="hint">${esc(SCAN_ERR[e?.code] || SCAN_ERR.network)}</span>${retryButtons}`;
    wireRetry();
  }
}

/* ================= CSV ================= */
$("csvBtn").onclick = () => {
  const rows = [["日付", "お店・内容", "品名", "ジャンル", "金額", "メモ"]];
  for (const e of monthExpenses(state.month).sort((a, b) => a.date.localeCompare(b.date)))
    for (const it of e.items) rows.push([e.date, e.store, it.name, CAT[it.category]?.label || "雑費", it.amount, e.memo || ""]);
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"})); a.download = `家計簿_${state.month}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};

/* ================= wiring ================= */
$("prevM").onclick = () => { state.month = shiftMonth(state.month, -1); render(); };
$("nextM").onclick = () => { state.month = shiftMonth(state.month, 1); render(); };
$("manualBtn").onclick = () => openEditor(newDraft("manual"));
$("camBtn").onclick = () => $("camInput").click();
$("pickBtn").onclick = () => $("pickInput").click();
for (const id of ["camInput", "pickInput"]) $(id).addEventListener("change", e => { const f = e.target.files?.[0]; e.target.value = ""; handlePhoto(f); });

showView("boot");
try { const em = localStorage.getItem("kakeibo-email"); if (em) $("authEmail").value = em; } catch {}
// In-app browsers (LINE, Instagram, …) throw away logins; point people to Safari / Chrome.
if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger|GSA\/|YJApp/i.test(navigator.userAgent)) $("inAppNote").hidden = false;
sb.auth.getSession().then(({data}) => { if (!data.session) showView("auth"); });
})();
